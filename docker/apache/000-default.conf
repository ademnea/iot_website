<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    # Uploaded files are never executed, even if the .htaccess guard is missing from the volume.
    <DirectoryMatch "^/var/www/html/public/(images|documents)">
        AllowOverride None
        Options -Indexes -ExecCGI
        <FilesMatch "\.(php\d?|phtml|phar|pl|py|cgi|sh)$">
            Require all denied
        </FilesMatch>
        php_admin_flag engine off
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
