# Runs the IoT Lab website and its own database, isolated from anything else on the host.
# Settings come from .env (see .env.example). Start with: docker compose up -d --build
name: iot-website

services:
  app:
    build:
      context: .
      target: app
    image: iot-website:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
    ports:
      # Bound to localhost only; the host's web server proxies the public domain to it.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - ${DATA_DIR:-./data}/images:/var/www/html/public/images
      - ${DATA_DIR:-./data}/documents:/var/www/html/public/documents
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Test suite: docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    # No env_file: Docker env vars override phpunit.xml, so only pass what the tests need.
    entrypoint: []
    environment:
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: iot_website_test
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  storage:
  db:
